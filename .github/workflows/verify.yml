name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify skill overlay
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm_config_ignore_scripts=true npx -y pnpm@10 install --frozen-lockfile

      - name: Run test suite
        run: npx -y pnpm@10 test

  unit-tests:
    name: Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: plugins/code/skills/patina-mode/scripts
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # oven-sh/setup-bun@v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test
