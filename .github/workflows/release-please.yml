name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Open or update release PRs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Mint patina-project-release App token
        id: app-token
        # actions/create-github-app-token@v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # googleapis/release-please-action@v4.1.3
      #
      # An App-authored release PR triggers the required checks. A GITHUB_TOKEN
      # PR does not. The mint step fails closed on an empty private key. There is
      # no GITHUB_TOKEN fallback.
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  auto-merge:
    name: Enable auto-merge on release PRs
    needs: release-please
    if: needs.release-please.outputs.releases_created != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable auto-merge on open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enable auto-merge on any open release-please PRs
          prs=$(gh pr list --label "autorelease: pending" --json number --jq '.[].number')
          for pr in $prs; do
            gh pr merge "$pr" --auto --squash
          done
