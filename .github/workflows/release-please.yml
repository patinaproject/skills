name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Open or update release PRs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # googleapis/release-please-action@v4.1.3
      #
      # NOTE: PRs created with the default GITHUB_TOKEN do NOT trigger subsequent
      # workflow runs (GitHub's anti-recursion safeguard), so required PR checks
      # never run on bot release PRs and the auto-merge job below waits forever.
      #
      # The token below prefers `RELEASE_PLEASE_TOKEN` (a GitHub App token or PAT
      # with `contents: write` + `pull-requests: write` + `issues: write`) and
      # falls back to GITHUB_TOKEN when that secret is unset. Adding the secret
      # is therefore the only step needed to enable fully-automated release PRs:
      # release PRs authored by the App identity trigger checks normally and
      # auto-merge once green, with no workflow edit. See docs/release-flow.md.
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  auto-merge:
    name: Enable auto-merge on release PRs
    needs: release-please
    if: needs.release-please.outputs.releases_created != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable auto-merge on open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enable auto-merge on any open release-please PRs
          prs=$(gh pr list --label "autorelease: pending" --json number --jq '.[].number')
          for pr in $prs; do
            gh pr merge "$pr" --auto --squash || true
          done
