name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Open or update release PRs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # release-please MUST author its PRs with a GitHub App/PAT identity
      # (RELEASE_PLEASE_TOKEN). The default GITHUB_TOKEN cannot: PRs it creates
      # do not trigger workflow runs (GitHub's anti-recursion safeguard), so
      # required checks never run and auto-merge stalls. A missing secret is a
      # misconfiguration, not a fallback case — fail the run loudly here rather
      # than degrading to the broken GITHUB_TOKEN path. See docs/release-flow.md.
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN secret is not set. Release automation requires a GitHub App or PAT token with contents/pull-requests/issues: write so release PR checks run. See docs/release-flow.md."
            exit 1
          fi

      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # googleapis/release-please-action@v4.1.3
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  auto-merge:
    name: Enable auto-merge on release PRs
    needs: release-please
    if: needs.release-please.outputs.releases_created != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable auto-merge on open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enable auto-merge on any open release-please PRs
          prs=$(gh pr list --label "autorelease: pending" --json number --jq '.[].number')
          for pr in $prs; do
            gh pr merge "$pr" --auto --squash || true
          done
