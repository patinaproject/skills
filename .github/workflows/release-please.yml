name: Release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Open or update release PRs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/create-github-app-token@v3.2.0
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # googleapis/release-please-action@v4.1.3
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          prs=()
          if [[ -n "${RELEASE_PRS:-}" && "${RELEASE_PRS}" != "null" ]]; then
            mapfile -t prs < <(jq -r '.[].number' <<<"${RELEASE_PRS}")
          fi

          # GitHub can lag briefly after Release Please creates the PR and label.
          # Retry discovery before failing instead of silently skipping auto-merge.
          for _ in {1..10}; do
            if ((${#prs[@]} > 0)); then
              break
            fi
            mapfile -t prs < <(gh pr list \
              --state open \
              --head 'release-please--branches--main--components--patinaproject-skills' \
              --json number \
              --jq '.[].number')
            if ((${#prs[@]} == 0)); then
              sleep 2
            fi
          done

          if ((${#prs[@]} == 0)); then
            echo 'Release Please reported a PR, but it was not discoverable for auto-merge.' >&2
            exit 1
          fi

          for pr in "${prs[@]}"; do
            gh pr merge "$pr" --auto --squash
          done
