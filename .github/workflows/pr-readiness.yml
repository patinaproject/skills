name: PR readiness

on:
  # Base-branch code evaluates untrusted PR evidence.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  repository_dispatch:
    types: [pr-readiness-receipt]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose evidence bundle is being ingested
        required: true
        type: string
      evidence_bundle:
        description: Immutable Actions artifact name containing observations.json
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

jobs:
  readiness:
    name: PR readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      # oven-sh/setup-bun@v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.4.2'
      - name: Install trusted evaluator dependencies
        run: bun install --cwd plugins/engineering/skills/patina-mode/scripts --frozen-lockfile
      - name: Download immutable evidence bundle
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence_bundle != '') || (github.event_name == 'repository_dispatch' && github.event.client_payload.evidence_bundle != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ inputs.evidence_bundle || github.event.client_payload.evidence_bundle }}
        run: gh run download --repo "$GITHUB_REPOSITORY" --name "$BUNDLE" --dir .patina/evidence
      - name: Read trusted remote pull-request state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p .patina/evidence
          if [ -n "$PR_NUMBER" ]; then gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,body,isDraft,baseRefName,baseRefOid,headRefName,headRefOid > .patina/pr.json; fi
          if [ ! -f .patina/evidence/observations.json ]; then printf '[]\n' > .patina/observations.json; else cp .patina/evidence/observations.json .patina/observations.json; fi
      - name: Evaluate current candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PATINA_READINESS_AUTOMATION: 'true'
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.client_payload.pr_number }}
        run: |
          set -euo pipefail
          # The evaluator derives candidate identity from forge metadata and git patch data.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            rc=0
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number'); do
              pr_rc=0
              bun plugins/engineering/skills/pr-readiness/scripts/pr-readiness check --repo "$GITHUB_REPOSITORY" --pr "$pr" --observations .patina/observations.json > ".patina/report-$pr.json" || pr_rc=$?
              head_sha=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
              state=success; [ "$pr_rc" -eq 0 ] || state=failure
              gh api "repos/$GITHUB_REPOSITORY/statuses/$head_sha" -f state="$state" -f context='PR readiness' -f description='Trusted readiness evaluation'
              [ "$pr_rc" -eq 0 ] || rc=1
            done
            test "$rc" -eq 0
          else
            set +e
            bun plugins/engineering/skills/pr-readiness/scripts/pr-readiness check --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --observations .patina/observations.json > .patina/report.json
            rc=$?
            set -e
            cat .patina/report.json
            if [ -n "$PR_NUMBER" ]; then
              state=success; [ "$rc" -eq 0 ] || state=failure
              gh api "repos/$GITHUB_REPOSITORY/statuses/$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" -f state="$state" -f context='PR readiness' -f description='Trusted readiness evaluation'
            fi
            test "$rc" -eq 0
          fi
      - name: Persist immutable readiness packet
        if: success()
        run: |
          mkdir -p .patina/readiness
          if compgen -G '.patina/report*.json' > /dev/null; then cp .patina/report*.json .patina/readiness/; else printf '[]\n' > .patina/readiness/empty.json; fi
      # actions/upload-artifact@v4.6.2
      - name: Upload immutable readiness packet
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: .patina/readiness/
          if-no-files-found: error
          retention-days: 90
