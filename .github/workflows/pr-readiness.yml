name: PR readiness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Verify, Actions, Markdown, Pull Request, PR readiness review relay]
    types: [completed]

permissions: {}

concurrency:
  group: pr-readiness-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: write
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # oven-sh/setup-bun@v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.4.2'

      - name: Resolve pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target) prs="$EVENT_PR" ;;
            workflow_run)
              prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_HEAD_SHA/pulls" --jq '.[] | select(.state == "open") | .number' | tr '\n' ' ')"
              ;;
            *) echo "::error::Unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          for pr in $prs; do
            if ! printf '%s' "$pr" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error::Invalid pull request number: $pr"
              exit 1
            fi
          done
          if [ -z "${prs// /}" ]; then
            echo "No open pull request has head $RUN_HEAD_SHA; nothing to gate."
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Evaluate and publish readiness
        if: steps.resolve.outputs.prs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.resolve.outputs.prs }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PATINA_READINESS_STORE: ${{ runner.temp }}/pr-readiness
        run: |
          for pr in $PRS; do
            plugins/engineering/skills/pr-readiness/scripts/pr-readiness gate --repo "$GITHUB_REPOSITORY" --pr "$pr" --target-url "$TARGET_URL"
          done
