name: PR readiness

on:
  # Evaluate with the base branch workflow so pull-request code cannot decide readiness.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  repository_dispatch:
    types: [pr-readiness-receipt]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    name: PR readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Evaluate readiness from trusted base code
        run: |
          echo "PR readiness evaluator loaded from trusted base: $GITHUB_SHA"
          test -x plugins/engineering/skills/pr-readiness/scripts/pr-readiness
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            echo "A missing or stale packet must fail the required PR readiness check."
          fi
