name: Skills release dispatch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Validate and dispatch stable release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      # actions/create-github-app-token@v3.2.0
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: target-app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: patinaproject
          repositories: patinaproject
          permission-contents: write

      - name: Validate release and notify the receiver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TARGET_REPOSITORY_TOKEN: ${{ steps.target-app-token.outputs.token }}
        run: node scripts/dispatch-skills-release.ts
