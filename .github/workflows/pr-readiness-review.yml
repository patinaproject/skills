name: PR readiness review relay

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  relay:
    name: Relay review event
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Announce pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Review event on pull request $PR_NUMBER"
